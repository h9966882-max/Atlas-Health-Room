<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas大学｜保健室</title><link rel="stylesheet" href="styles.css"></head><body><div id="login" class="gate"><div class="gate-card"><div class="mark">A</div><p class="eyebrow">ATLAS UNIVERSITY</p><h1>保健室</h1><p class="sub">調子がいい日も、悪い日も。<br>ここは、観測しておく場所。</p><form id="loginForm"><label>メールアドレス<input id="email" type="email" required></label><label>パスワード<input id="password" type="password" required></label><button>保健室に入る</button><p id="loginMsg" class="msg"></p></form></div></div><div id="app" class="app hidden"><header><div><p class="eyebrow">ATLAS UNIVERSITY</p><h1>保健室 <span>Health Room</span></h1></div><button id="logout" class="ghost">退出</button></header><nav id="ranges"><button class="active" data-range="today">今日</button><button data-range="7">7日</button><button data-range="30">30日</button><button data-range="90">90日</button><button data-range="all">全期間</button></nav><main><section class="hero"><div><p class="eyebrow">TODAY'S OBSERVATION</p><h2 id="todayDate">—</h2><p id="words">記録を読み込んでいます。</p></div><div class="pulse">＋</div></section><section id="cards" class="cards"></section><section class="panel"><div class="panel-head"><div><p class="eyebrow">TREND</p><h2>朝の推移</h2></div><select id="metric"><option value="bp">血圧</option><option value="hr">心拍</option><option value="hrv">HRV</option><option value="score">自律神経スコア</option><option value="sleep">睡眠</option></select></div><canvas id="chart" width="900" height="330"></canvas></section><section class="panel"><p class="eyebrow">DAILY NOTES</p><h2>ことばの記録</h2><div id="notes"></div></section></main><footer>MODBを正本として表示する閲覧用プロトタイプ</footer></div><script src="config.js"></script><script src="app.js"></script></body></html>
